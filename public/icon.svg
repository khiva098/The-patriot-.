<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1B" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Midnight Shield Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Filigree Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="10" filter="url(#goldGlow)" />
  <rect x="42" y="42" width="428" height="428" rx="80" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-dasharray="10 10" opacity="0.6" />

  <!-- Corner Sovereign Diamonds -->
  <polygon points="56,56 64,48 72,56 64,64" fill="url(#goldGrad)" />
  <polygon points="456,56 464,48 472,56 464,64" fill="url(#goldGrad)" />
  <polygon points="56,456 64,448 72,456 64,464" fill="url(#goldGrad)" />
  <polygon points="456,456 464,448 472,456 464,464" fill="url(#goldGrad)" />

  <!-- Sovereign Star at Top -->
  <polygon points="256,92 268,124 300,124 274,144 284,176 256,156 228,176 238,144 212,124 244,124" fill="url(#goldGrad)" />

  <!-- Royal Serif Capital "P" Letterform -->
  <text x="256" y="380" font-family="'Playfair Display', Georgia, serif" font-size="280" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">P</text>

  <!-- Sovereign Baseline Accent Line -->
  <line x1="170" y1="416" x2="342" y2="416" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" />
</svg>
